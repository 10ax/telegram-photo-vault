name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The test job only reads the repository: checkout, install, lint, test.
# Deny everything the token could otherwise do (push, edit releases, ...).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, so don't leave an authenticated remote in
          # .git/config for later steps to use.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app scripts

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q
