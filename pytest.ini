[pytest]
testpaths = tests
# The suite imports the app as a top-level package. `python -m pytest` puts the repo
# root on sys.path and hides this; bare `pytest` (what CI runs) does not, and every
# run died in conftest with ModuleNotFoundError: No module named 'app'.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
